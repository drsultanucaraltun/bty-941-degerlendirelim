<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Değerlendirelim – Algoritma ve Akış Diyagramlarının Test Edilmesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ==== BTY 9.4.1 Değerlendirelim — Articulate (1920x1080) görünümü + TYMM v2.1 etkileşim kuralları ==== */
:root{
  --ink:#1C2B45;      /* metin (Articulate kart metni + video lacivert) */
  --title:#2372A6;    /* sahne başlığı */
  --accent:#1F4A86;   /* yönerge / ipucu */
  --num:#3480D7;      /* sayfa numarası */
  --purple:#6A4FB3; --purple-bg:#F4F1FB;
  --teal:#178F99;   --teal-bg:#EDF7F8;
  --check:#3F51B5;    /* Kontrol Et + hak noktaları */
  --mavi:#2B62B0; --ok:#2E7D4F; --okbg:#E7F3EC; --bad:#B5452F;
  --kagit:#F6F7F8; --sis:#C6CBD2; --odak:#E0A92E; --line:#DDE2EA;
  --fs-title:58.67px; --fs-instr:34.67px; --fs:32px; --fs-card:28px; --fs-hint:28px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fff}
body{position:fixed;inset:0;overflow:hidden;color:var(--ink);font-family:'Open Sans',system-ui,Arial,sans-serif;font-weight:400;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button,select{font-family:inherit}
#root{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#fff;transform-origin:0 0}
.screen{position:absolute;inset:0}
.screen[hidden]{display:none}
:focus-visible{outline:4px solid var(--odak);outline-offset:3px}

/* ---- Articulate üst bandı: robot + çizgi + EBA + numara halkası ---- */
.band{position:absolute;left:0;top:0;width:1920px;height:180px;pointer-events:none}
.stitle{position:absolute;left:285px;top:33px;height:80px;margin:0;display:flex;align-items:center;
  font-size:var(--fs-title);font-weight:700;color:var(--title);white-space:nowrap;letter-spacing:.2px}
.pno{position:absolute;left:1830px;top:84px;width:60px;height:60px;display:flex;align-items:center;justify-content:center;
  font-size:35.33px;font-weight:700;color:var(--num)}

/* ---- sahne iskeleti ---- */
.main{position:absolute;left:96px;right:96px;top:192px;bottom:156px;display:flex;flex-direction:column}
.main:focus{outline:none}
.toprow{display:flex;align-items:flex-start;gap:40px;margin-bottom:26px}
.instr{flex:1 1 auto;margin:0;font-size:var(--fs-instr);font-weight:700;color:var(--accent);line-height:1.36}
.dots{flex:none;display:flex;gap:14px;padding-top:12px}
.dot{width:26px;height:26px;border-radius:50%;background:var(--check);border:3px solid var(--check)}
.dot.off{background:#fff}
.stage{flex:1 1 auto;min-height:0;position:relative}

/* ---- alt çubuk: Kontrol Et sol, ipucu + İleri sağ (Articulate konumları) ---- */
.btn{font-weight:700;font-size:32px;color:#fff;background:var(--check);border:none;border-radius:14px;
  padding:0 48px;height:86px;cursor:pointer;box-shadow:0 6px 0 #2C3A8C,0 12px 24px rgba(28,43,69,.18)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #2C3A8C}
.btn.hide{display:none}
#check{position:absolute;left:96px;top:933px}
.nextb{position:absolute;left:1680px;top:933px;width:94px;height:88px;padding:0;border:0;border-radius:18px;
  background:transparent center/contain no-repeat;cursor:pointer;filter:drop-shadow(0 4px 8px rgba(28,43,69,.22))}
.nextb[aria-disabled="true"]{opacity:.38;filter:grayscale(.5);cursor:not-allowed}
.nextb.on{animation:ileriNabiz 1.8s ease-in-out infinite}
.backb{left:1547px}
.nextb.hide{display:none}
@keyframes ileriNabiz{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---- kartlar (classify + match çipleri): Articulate kart görünümü ---- */
.pool{display:flex;flex-wrap:wrap;gap:16px 24px;justify-content:center;align-content:flex-start;min-height:60px}
.card,.chip{display:inline-flex;align-items:center;justify-content:center;height:60px;padding:0 26px;min-width:290px;
  background:#fff;border:2px solid #CFD4DC;border-radius:10px;box-shadow:0 3px 8px rgba(28,43,69,.10);
  font-size:var(--fs-card);font-weight:700;color:var(--ink);white-space:nowrap;
  cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.card.drag-op,.chip.drag-op{opacity:.3}
.card.sel,.chip.sel{border-color:var(--odak);box-shadow:0 0 0 4px rgba(224,169,46,.45)}
.ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.97;box-shadow:0 14px 30px rgba(28,43,69,.28)!important;transform-origin:0 0;margin:0}

/* ---- classify ---- */
.cboxes{display:flex;gap:48px;justify-content:center;margin-top:34px}
.cbox{flex:1 1 0;max-width:840px;min-height:300px;display:flex;flex-direction:column;border:3px dashed;border-radius:16px;padding:14px 22px 22px}
.cbox.p{border-color:var(--purple);background:var(--purple-bg)} .cbox.p h3{color:var(--purple)}
.cbox.t{border-color:var(--teal);background:var(--teal-bg)}     .cbox.t h3{color:var(--teal)}
.cbox h3{margin:0 0 14px;text-align:center;font-size:var(--fs-instr);font-weight:700}
.cdrop{flex:1 1 auto;display:flex;flex-wrap:wrap;gap:14px 20px;justify-content:center;align-content:flex-start;min-height:150px;border-radius:10px}
.cdrop .card{min-width:350px}
.cdrop.hot,.slot.hot{outline:4px solid var(--title);outline-offset:4px}
.card.reveal{border:2px dashed var(--ok);background:var(--okbg)}

/* ---- match (Hangi Test?) ---- */
.rows{display:flex;flex-direction:column;gap:18px;margin-top:30px}
.row{display:flex;align-items:center;gap:24px}
.badge{width:58px;height:58px;flex:none;border-radius:50%;background:var(--teal);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:30px}
.prompt{flex:1 1 auto;min-height:70px;background:#fff;border:1px solid var(--line);border-top:5px solid var(--purple);border-radius:12px;
  box-shadow:0 4px 12px rgba(28,43,69,.09);padding:8px 26px;font-size:var(--fs);font-weight:600;color:var(--ink);display:flex;align-items:center}
.arrow{flex:none;font-size:40px;color:var(--accent);font-weight:700;line-height:1}
.slot{width:380px;height:64px;flex:none;border:3px dashed #9AA3B2;border-radius:12px;background:var(--kagit);
  display:flex;align-items:center;justify-content:center}
.slot.filled{border:none;background:transparent}
.slot .chip{width:100%;min-width:0;height:64px;padding:0 12px}
.slot.reveal .chip{border:2px dashed var(--ok);background:var(--okbg)}

/* ---- select ---- */
.scns{display:flex;flex-direction:column;gap:34px;margin-top:8px}
.scn{font-size:var(--fs);font-weight:600;color:var(--ink);line-height:1.75;background:#fff;border:1px solid var(--line);
  border-left:8px solid var(--purple);border-radius:12px;padding:14px 28px;box-shadow:0 4px 12px rgba(28,43,69,.07)}
.scn b{color:var(--accent)}
.dd{font-size:29px;font-weight:700;color:var(--ink);border:2px solid var(--title);border-radius:10px;padding:4px 12px;
  min-height:54px;background:#fff;margin:0 8px;vertical-align:middle;cursor:pointer}
.dd{display:inline-flex;align-items:center;gap:14px;line-height:1.2}
.dd.bos .ddt{color:#5B6B85}
.dd .ddc{font-size:22px;color:var(--title)}
.dd:disabled{opacity:1;cursor:default}
.dd:disabled .ddc{visibility:hidden}
.dd[aria-expanded="true"]{box-shadow:0 0 0 4px rgba(35,114,166,.25)}
.ddl{position:absolute;z-index:900;background:#fff;border:2px solid var(--title);border-radius:12px;box-shadow:0 14px 34px rgba(28,43,69,.22);padding:6px;max-height:440px;overflow:auto}
.ddo{font-size:28px;font-weight:600;color:var(--ink);padding:10px 18px;border-radius:8px;cursor:pointer;white-space:nowrap}
.ddo:hover,.ddo:focus{background:#E3EEF7;outline:none}
.ddo[aria-selected="true"]{background:#D4E5F3;color:#123A73}
.dd.reveal{border-color:var(--ok);background:var(--okbg);color:#1F5B39}

/* ---- pick: video ile aynı akış diyagramı dili ---- */
.pwrap{display:flex;gap:70px;align-items:flex-start}
.flow{position:relative;width:840px;height:560px;flex:none}
.flow svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.flow .ln{fill:none;stroke:var(--ink);stroke-width:2.6}
.flow .ah{fill:var(--ink)}
.flow .lbl{font-family:'Open Sans',Arial,sans-serif;font-size:24px;font-weight:700}
.flow .lbl.e{fill:var(--ok)} .flow .lbl.h{fill:var(--bad)}
.shp{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:27px;font-weight:600;color:var(--ink);background:transparent;border:0;padding:0 30px;margin:0;line-height:1.15;border-radius:12px}
.shp svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:0}
.shp svg .fig{fill:#EEF1F5;stroke:var(--ink);stroke-width:2.4;vector-effect:non-scaling-stroke}
.shp span{position:relative;z-index:1}
.shp.term svg .fig{fill:var(--ink)}
.shp.term{color:#fff;font-weight:700}
button.shp{cursor:pointer}
button.shp:hover svg .fig{stroke:var(--mavi);stroke-width:4}
button.shp.sel svg .fig{fill:#DCE7F7;stroke:var(--mavi);stroke-width:5}
button.shp.sel{color:#123A73}
button.shp.correct svg .fig{fill:var(--okbg);stroke:var(--ok);stroke-width:5}
button.shp.correct{color:#1F5B39}
button.shp:disabled{cursor:default}
.pside{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:24px}
/* videodaki yırtık kenarlı kâğıt etiket */
.kagit{position:relative;isolation:isolate;padding:10px 30px 12px;font-weight:700;line-height:1.2;color:#fff;font-size:34px}
.kagit::before,.kagit::after{content:'';position:absolute;inset:0;clip-path:var(--yirtik,none);z-index:-1}
.kagit::before{background:rgba(0,0,0,.13);transform:translate(4px,6px)}
.kagit::after{background:var(--mavi)}
.pout{align-self:stretch;background:var(--ink);border-radius:12px;box-shadow:0 10px 26px rgba(28,43,69,.25);overflow:hidden;color:#fff}
.pout .bar{display:flex;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid rgba(255,255,255,.14);font-size:24px;font-weight:600}
.pout .bar i{width:13px;height:13px;border-radius:50%;display:inline-block}
.pout .runs{padding:6px 26px 14px}
.run{padding:12px 0;border-bottom:1px dashed rgba(255,255,255,.18);font-size:27px;line-height:1.38}
.run:last-child{border-bottom:0}
.run .n{color:#9FB6DA;font-weight:700;margin-right:14px}
.run .in{white-space:pre}
.run .o{color:var(--odak);font-weight:700}
.run .b{color:#C9D3E3;font-weight:400}

/* ---- modal (TYMM) ---- */
.ov{position:absolute;inset:0;z-index:1000;background:#fff;display:none;align-items:center;justify-content:center}
.ov.show{display:flex}
.mcard{width:960px;max-width:90%;background:#fff;border:1px solid #E2E5EC;border-top:8px solid var(--title);border-radius:22px;
  box-shadow:0 24px 60px rgba(28,43,69,.18);padding:56px 60px;text-align:center}
.mcard.k-ok{border-top-color:var(--ok)} .mcard.k-bad{border-top-color:var(--bad)} .mcard.k-warn{border-top-color:var(--odak)}
.mcard .ic{font-size:92px;line-height:1;margin-bottom:16px}
.mcard .ic:empty{display:none}
.mcard h2{margin:0 0 16px;font-size:50px;font-weight:700;color:var(--ink)}
.mcard.k-ok h2{color:var(--ok)} .mcard.k-bad h2{color:var(--bad)}
.mcard p{margin:0 0 34px;font-size:34px;font-weight:400;color:var(--ink)}
.mcard p.none{display:none}
.mcard .btn{position:static;height:80px}

/* ---- bitiş ---- */
.endc{position:absolute;left:0;right:0;top:230px;display:flex;flex-direction:column;align-items:center;text-align:center}
.endc img{width:210px;height:auto;margin-bottom:30px}
.endc h2{margin:0 0 14px;font-size:64px;font-weight:700;color:var(--ok)}
.endc p{margin:0 0 50px;font-size:var(--fs-instr);font-weight:600;color:var(--ink)}
.endc .btn{position:static}

.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root">


  <!-- ETKİNLİK SAHNELERİ -->
  <div class="screen" id="appS">
    <div id="app">
      <img class="band" alt="" aria-hidden="true" data-img="header">
      <h1 class="stitle" id="scTitle"></h1>
      <div class="pno" id="pno" aria-hidden="true"></div>
      <main class="main" id="main" tabindex="-1">
        <div class="toprow">
          <p class="instr" id="instr"></p>
          <div class="dots" id="dots"></div>
        </div>
        <div class="stage" id="stage"></div>
      </main>
      <button class="btn" id="check">Kontrol Et</button>
      <button class="nextb backb hide" id="back" aria-label="Geri" data-bg="back"></button>
      <button class="nextb" id="next" aria-label="İleri" aria-disabled="true" data-bg="next"></button>
    </div>
  </div>

  <!-- BİTİŞ -->
  <section class="screen" id="end" hidden aria-labelledby="enT">
    <img class="band" alt="" aria-hidden="true" data-img="header">
    <h1 class="stitle">Değerlendirelim</h1>
    <div class="endc">
      <img alt="" aria-hidden="true" data-img="check">
      <h2 id="enT" tabindex="-1">Tebrikler!</h2>
      <p>Değerlendirelim bölümünü tamamladınız.</p>
      <button class="btn" id="again">Baştan Başla</button>
    </div>
  </section>

  <div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovT" aria-describedby="ovP">
    <div class="mcard" id="ovCard">
      <div class="ic" id="ovIc" aria-hidden="true"></div>
      <h2 id="ovT"></h2>
      <p id="ovP"></p>
      <button class="btn" id="ovBtn"></button>
    </div>
  </div>
</div>

var AUD={};
try{ AUD.ok=new Audio(SND.ok); AUD.no=new Audio(SND.no); AUD.ok.preload='auto'; AUD.no.preload='auto'; }catch(e){}
var sndUnlocked=false;
function unlockAudio(){
  if(sndUnlocked) return; sndUnlocked=true;
  ['ok','no'].forEach(function(k){ var a=AUD[k]; if(!a) return;
    try{ a.muted=true; var p=a.play();
      if(p&&p.then){ p.then(function(){ a.pause(); a.currentTime=0; a.muted=false; }).catch(function(){ a.muted=false; }); }
      else { a.pause(); a.currentTime=0; a.muted=false; }
    }catch(e){} });
}
function play(k){ var a=AUD[k]; if(!a){ try{ a=new Audio(SND[k]); }catch(e){ return; } }
  try{ a.muted=false; a.volume=0.9; a.currentTime=0; var p=a.play(); if(p&&p.catch) p.catch(function(){}); }catch(e){} }
document.addEventListener('pointerdown', unlockAudio, true);
document.addEventListener('click', unlockAudio, true);
function announce(t){ live.textContent=''; setTimeout(function(){ live.textContent=t; },30); }

/* ---- yardımcılar ---- */
function shuffle(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=b[i];b[i]=b[j];b[j]=t;} return b; }
function shuffleDistinct(ids){ if(ids.length<2) return ids.slice(); var s, g=0;
  do{ s=shuffle(ids); g++; }while(g<40 && s.join('|')===ids.join('|')); return s; }
function mk(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function keyAct(el,fn){ el.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); fn(); } }); }
function yirtik(){ /* videodaki yırtık kâğıt kenarı */
  var p=[],i,n=28,r=function(){ return (0.6+Math.random()*4.2).toFixed(1); };
  for(i=0;i<=n;i++) p.push((i*100/n).toFixed(2)+'% '+r()+'px');
  for(i=1;i<9;i++) p.push('calc(100% - '+r()+'px) '+(i*100/9).toFixed(2)+'%');
  for(i=n;i>=0;i--) p.push((i*100/n).toFixed(2)+'% calc(100% - '+r()+'px)');
  for(i=8;i>=1;i--) p.push(r()+'px '+(i*100/9).toFixed(2)+'%');
  return 'polygon('+p.join(',')+')';
}

/* ================= ORTAK SÜRÜKLEME (match & classify) ================= */
var drag=null;
function clearGhosts(){ $$('.ghost').forEach(function(g){ g.remove(); }); }
window.addEventListener('pointerup', clearGhosts);
window.addEventListener('pointercancel', function(){ clearGhosts(); restoreDragEl(); drag=null; });
window.addEventListener('blur', function(){ clearGhosts(); restoreDragEl(); drag=null; });
function restoreDragEl(){ if(drag&&drag.el){ drag.el.classList.remove('drag-op'); drag.el.style.pointerEvents=''; } }
function onDown(e){
  if(locked) return;
  if(e.button!=null && e.button>0) return;
  var el=e.currentTarget;
  drag={el:el,sx:e.clientX,sy:e.clientY,moved:false,ghost:null};
  document.addEventListener('pointermove',onMove,{passive:false});
  document.addEventListener('pointerup',onUp);
  document.addEventListener('pointercancel',onUp);
}
function onMove(e){
  if(!drag) return;
  var dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
  if(!drag.moved){
    if(Math.hypot(dx,dy)<6) return;
    drag.moved=true;
    var r=drag.el.getBoundingClientRect();
    var g=drag.el.cloneNode(true); g.className=drag.el.className+' ghost';
    g.classList.remove('drag-op','sel');
    g.style.width=(r.width/K)+'px'; g.style.height=(r.height/K)+'px'; g.style.minWidth='0';
    g.style.transform='scale('+K+')';
    g.style.left=r.left+'px'; g.style.top=r.top+'px';
    drag.ox=e.clientX-r.left; drag.oy=e.clientY-r.top;
    document.body.appendChild(g); drag.ghost=g;
    drag.el.classList.add('drag-op'); drag.el.style.pointerEvents='none';
  }
  if(e.cancelable) e.preventDefault();
  drag.ghost.style.left=(e.clientX-drag.ox)+'px';
  drag.ghost.style.top =(e.clientY-drag.oy)+'px';
  var t=targetAt(e.clientX,e.clientY);
  $$('.hot').forEach(function(x){x.classList.remove('hot');});
  if(t && t.dataset.drop!=='pool') t.classList.add('hot');
}
function onUp(e){
  if(!drag) return;
  document.removeEventListener('pointermove',onMove,{passive:false});
  document.removeEventListener('pointerup',onUp);
  document.removeEventListener('pointercancel',onUp);
  var el=drag.el, moved=drag.moved, cancelled=(e.type==='pointercancel');
  clearGhosts(); $$('.hot').forEach(function(x){x.classList.remove('hot');});
  el.classList.remove('drag-op'); el.style.pointerEvents='';
  if(cancelled){ drag=null; return; }
  if(!moved){ handleTap(el); drag=null; return; }
  var t=targetAt(e.clientX,e.clientY);
  if(t) placeInto(el,t);
  drag=null;
}
function targetAt(x,y){
  var n=document.elementFromPoint(x,y);
  while(n && n!==document.body){ if(n.dataset && n.dataset.drop) return n; n=n.parentNode; }
  return null;
}
/* tıkla-seç → tıkla-yerleştir (WCAG 2.5.7) + klavye */
function toggleSelect(el){
  if(selChip===el){ el.classList.remove('sel'); selChip=null; return; }
  if(selChip) selChip.classList.remove('sel');
  selChip=el; el.classList.add('sel'); announce('Kart seçildi. Bir alana tıklayarak yerleştiriniz.');
}
function handleTap(el){
  if(selChip && selChip!==el){
    var dz=el.closest('.slot,.cdrop,.pool');
    if(dz){ placeInto(selChip,dz); return; }
  }
  toggleSelect(el);
}
function onTargetActivate(t){ if(locked) return; if(selChip) placeInto(selChip,t); }
function detach(el){ var p=el.parentNode; if(p&&p.classList.contains('slot')) p.classList.remove('filled'); }
function placeInto(el,target){
  if(locked) return;
  var type=target.dataset.drop, pool=$('#pool');
  if(type==='pool'){ detach(el); target.appendChild(el); }
  else if(type==='slot'){
    var ex=target.querySelector('.chip');
    if(ex && ex!==el){ pool.appendChild(ex); }
    detach(el); target.appendChild(el); target.classList.add('filled');
  }
  else if(type==='box'){ detach(el); target.appendChild(el); }
  if(selChip){ selChip.classList.remove('sel'); selChip=null; }
  announce('Yerleştirildi.');
}
/* Tipten bağımsız TAM SIFIRLAMA */
function hardReset(){
  clearGhosts();
  if(selChip){ selChip.classList.remove('sel'); selChip=null; }
  var pool=$('#pool');
  if(pool){
    $$('.slot .chip, .cdrop .card').forEach(function(e){
      e.classList.remove('sel','drag-op','hot'); e.style.pointerEvents=''; e.style.opacity=''; pool.appendChild(e); });
    shuffle($$('.chip,.card',pool)).forEach(function(e){ pool.appendChild(e); });
  }
  $$('.slot').forEach(function(s){ s.classList.remove('filled','hot'); });
  $$('.cdrop').forEach(function(d){ d.classList.remove('hot'); });
  ddClose(); $$('.dd').forEach(function(s){ ddSet(s,''); });
  $$('button.shp').forEach(function(b){ b.classList.remove('sel'); b.setAttribute('aria-pressed','false'); });
}
function makeDraggable(el,label){
  el.tabIndex=0; el.setAttribute('role','button'); el.setAttribute('aria-label',label);
  el.addEventListener('pointerdown',onDown);
  keyAct(el,function(){ if(!locked) handleTap(el); });
}
function makeDrop(el,label){
  el.tabIndex=0; el.setAttribute('role','button'); el.setAttribute('aria-label',label);
  el.addEventListener('click',function(e){ if(e.target===el || !e.target.closest('.chip,.card')) onTargetActivate(el); });
  keyAct(el,function(){ onTargetActivate(el); });
}

var T={};
var SVGNS='http://www.w3.org/2000/svg';
function shapeSvg(kind){
  var s=document.createElementNS(SVGNS,'svg'); s.setAttribute('viewBox','0 0 100 100'); s.setAttribute('preserveAspectRatio','none'); s.setAttribute('aria-hidden','true');
  var f;
  if(kind==='term'||kind==='rect'){ f=document.createElementNS(SVGNS,'rect'); f.setAttribute('x','0'); f.setAttribute('y','0'); f.setAttribute('width','100'); f.setAttribute('height','100');
    if(kind==='term'){ f.setAttribute('rx','14'); f.setAttribute('ry','50'); } else { f.setAttribute('rx','1'); f.setAttribute('ry','3'); } }
  else { f=document.createElementNS(SVGNS,'polygon'); f.setAttribute('points', kind==='diamond'?'50,0 100,50 50,100 0,50':'8,0 100,0 92,100 0,100'); }
  f.setAttribute('class','fig'); s.appendChild(f); return s;
}

/* ---- select: sayfa içi açılır liste (yerel <select> penceresi ölçeklenmediği için) ---- */
var ddOpen=null;
function ddSet(dd,v){ dd.dataset.value=v; dd.querySelector('.ddt').textContent=v||'Seçiniz'; dd.classList.toggle('bos',!v); }
function ddClose(focusBtn){ if(!ddOpen) return; var d=ddOpen; ddOpen=null; d.list.remove(); d.btn.setAttribute('aria-expanded','false'); if(focusBtn) try{ d.btn.focus(); }catch(e){} }
function ddOpenList(dd){
  if(locked||dd.disabled) return; if(ddOpen){ var same=ddOpen.btn===dd; ddClose(); if(same) return; }
  var ul=mk('div','ddl'); ul.setAttribute('role','listbox'); ul.id=dd.id+'-l'; ul.setAttribute('aria-label',dd.getAttribute('aria-label'));
  JSON.parse(dd.dataset.opts).forEach(function(op){
    var o=mk('div','ddo',op); o.setAttribute('role','option'); o.tabIndex=-1; o.setAttribute('aria-selected',dd.dataset.value===op?'true':'false');
    o.addEventListener('click',function(e){ e.stopPropagation(); ddSet(dd,op); ddClose(true); announce(op+' seçildi.'); });
    o.addEventListener('keydown',function(e){ var all=$$('.ddo',ul), i=all.indexOf(o);
      if(e.key==='ArrowDown'){ e.preventDefault(); (all[i+1]||all[0]).focus(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); (all[i-1]||all[all.length-1]).focus(); }
      else if(e.key==='Enter'||e.key===' '){ e.preventDefault(); o.click(); }
      else if(e.key==='Escape'||e.key==='Tab'){ e.preventDefault(); ddClose(true); } });
    ul.appendChild(o);
  });
  root.appendChild(ul);
  var r=dd.getBoundingClientRect(), rr=root.getBoundingClientRect();
  var left=(r.left-rr.left)/K, top=(r.bottom-rr.top)/K+6, w=r.width/K;
  ul.style.minWidth=Math.max(w,220)+'px'; ul.style.left=left+'px';
  var h=ul.offsetHeight; if(top+h>H-20) top=(r.top-rr.top)/K-6-h;
  if(left+ul.offsetWidth>W-40) ul.style.left=(W-40-ul.offsetWidth)+'px';
  ul.style.top=top+'px';
  dd.setAttribute('aria-expanded','true'); ddOpen={btn:dd,list:ul};
  var cur=$('.ddo[aria-selected="true"]',ul)||$('.ddo',ul); if(cur) cur.focus();
}
document.addEventListener('pointerdown',function(e){ if(ddOpen && !ddOpen.list.contains(e.target) && (!e.target.closest || e.target.closest('.dd')!==ddOpen.btn)) ddClose(); },true);

/* ================= KİLİT / MODAL / KONTROL ================= */
function lockAll(){ locked=true;
  $$('.chip,.card').forEach(function(e){ e.style.pointerEvents='none'; e.tabIndex=-1; e.style.cursor='default'; });
  $$('.slot,.cdrop').forEach(function(e){ e.tabIndex=-1; });
  ddClose(); $$('.dd').forEach(function(s){ s.disabled=true; });
  $$('button.shp').forEach(function(b){ b.disabled=true; });
  check.classList.add('hide');
}
function sceneDone(){ lockAll(); done=true; nextBtn.setAttribute('aria-disabled','false'); nextBtn.classList.add('on');
  nextBtn.setAttribute('aria-label', idx===CFG.scenes.length-1?'Bitir':'İleri'); }
var MOD={
  ok:    {ic:'',k:'k-ok',  t:'Doğru!',  p:'Tebrikler! Etkinliği başarıyla tamamladınız.', btn:'Tamam',       esc:false,snd:'ok'},
  wrong: {ic:'❌',k:'k-bad', t:'Yanlış!', p:'Lütfen, yeniden deneyiniz!',                    btn:'Tekrar Dene', esc:true, snd:'no'},
  empty: {ic:'⚠️',k:'k-warn',t:'Eksik!',  p:'',                                               btn:'Tamam',       esc:true, snd:'no'},
  reveal:{ic:'❌',k:'k-bad', t:'Yanlış!', p:'Doğru cevaplar ekranda gösterilecektir.',        btn:'Doğru Cevapları Gör', esc:true, snd:'no'}
};
function showModal(kind,after,ptext){
  var m=MOD[kind], p=(ptext!=null)?ptext:m.p; pendingAfter=after||null;
  ovCard.className='mcard '+m.k; ovIc.textContent=m.ic; ovT.textContent=m.t;
  ovP.textContent=p; ovP.classList.toggle('none',!p); ovBtn.textContent=m.btn;
  ov.dataset.esc=m.esc?'1':'0';
  lastFocus=document.activeElement;
  app.setAttribute('aria-hidden','true'); app.setAttribute('inert','');
  ov.classList.add('show'); play(m.snd); announce(m.t+' '+p); ovBtn.focus();
}
function closeModal(){
  ov.classList.remove('show'); app.removeAttribute('aria-hidden'); app.removeAttribute('inert');
  var fn=pendingAfter; pendingAfter=null; if(fn) fn();
  var f=!check.classList.contains('hide')?check:(done?nextBtn:(lastFocus||$('#main')));
  try{ f.focus(); }catch(e){}
}
ovBtn.addEventListener('click',closeModal);
document.addEventListener('keydown',function(e){
  if(!ov.classList.contains('show')) return;
  if(e.key==='Escape' && ov.dataset.esc==='1'){ e.preventDefault(); closeModal(); }
  if(e.key==='Tab'){ e.preventDefault(); ovBtn.focus(); }
});
function onCheck(){
  if(locked) return;
  var t=T[SC.type];
  if(!t.filled()){ showModal('empty', null, SC.empty); return; }
  if(t.correct()){ sceneDone(); showModal('ok'); return; }
  lives--; renderDots();
  if(lives<=0) showModal('reveal', function(){ hardReset(); t.reveal(); sceneDone(); });
  else showModal('wrong', hardReset);
}

/* ================= SAHNE AKIŞI ================= */
function show(id){ ['appS','end'].forEach(function(s){ $('#'+s).hidden=(s!==id); }); }
var KAYIT=[]; /* sahne durumları: geri/ileri dönüşte cevaplar, hak ve kilit korunur */
function saveScene(){
  if(SC==null) return; ddClose();
  clearGhosts(); if(selChip){ selChip.classList.remove('sel'); selChip=null; }
  var f=document.createDocumentFragment(); while(stage.firstChild) f.appendChild(stage.firstChild);
  KAYIT[idx]={frag:f, lives:lives, done:done};
}
function loadScene(i){
  idx=i; SC=CFG.scenes[i]; selChip=null; stage.innerHTML='';
  var k=KAYIT[i];
  lives=k?k.lives:MAXL; done=k?k.done:false; locked=done;
  $('#scTitle').textContent=SC.title; $('#pno').textContent=String(i+1);
  $('#instr').textContent=SC.instr;
  renderDots();
  check.classList.toggle('hide',done);
  nextBtn.setAttribute('aria-disabled',done?'false':'true'); nextBtn.classList.toggle('on',done);
  nextBtn.setAttribute('aria-label',(done&&i===CFG.scenes.length-1)?'Bitir':'İleri');
  backBtn.classList.toggle('hide',i===0);
  show('appS');
  if(k){ stage.appendChild(k.frag); KAYIT[i]=null; }
  else { T[SC.type].build(); var pl=$('#pool'); if(pl) pl.style.minHeight=pl.offsetHeight+'px'; /* havuz boşalınca alanlar kaymasın */ }
  try{ $('#main').focus(); }catch(e){}
  announce((i+1)+'. etkinlik: '+SC.title);
}
check.addEventListener('click',onCheck);
nextBtn.addEventListener('click',function(){
  if(!done) return;
  saveScene();
  if(idx<CFG.scenes.length-1) loadScene(idx+1);
  else { show('end'); scormComplete(); play('ok'); try{ $('#enT').focus(); }catch(e){} }
});
backBtn.addEventListener('click',function(){ if(idx<=0) return; saveScene(); loadScene(idx-1); });
$('#again').addEventListener('click',function(){ KAYIT=[]; SC=null; loadScene(0); });
loadScene(0);
})();
</script>
</body>
</html>
